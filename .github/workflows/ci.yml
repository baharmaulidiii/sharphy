name: CI & Build Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Solution
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8 & 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore Sharphy.sln

      - name: Build Solution
        run: dotnet build Sharphy.sln --no-restore --configuration Release

      - name: Test Solution (.NET 8)
        run: dotnet run --project tests/Sharphy.Tests/Sharphy.Tests.csproj --framework net8.0 -c Release

      - name: Test Solution (.NET 10)
        run: dotnet run --project tests/Sharphy.Tests/Sharphy.Tests.csproj --framework net10.0 -c Release
