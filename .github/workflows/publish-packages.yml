name: Publish NuGet Packages

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string to pack (e.g., 0.1.0-preview)'
        required: false
        default: '0.1.0-preview'

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8 & 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Determine Package Version
        id: versioning
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.version }}" -ne "") {
            $ver = "${{ github.event.inputs.version }}"
          } elseif ("${{ github.ref_name }}" -match '^v?(.*)$') {
            $ver = $matches[1]
          } else {
            $ver = "0.1.0-preview"
          }
          Write-Output "Resolved version: $ver"
          "PACKAGE_VERSION=$ver" >> $env:GITHUB_ENV

      - name: Restore dependencies
        run: dotnet restore Sharphy.sln

      - name: Pack All 3 Packages (Core, Server, Cli)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./nupkgs
          dotnet pack src/Sharphy.Core/Sharphy.Core.csproj -c Release -o ./nupkgs /p:PackageVersion=${{ env.PACKAGE_VERSION }}
          dotnet pack src/Sharphy.Server/Sharphy.Server.csproj -c Release -o ./nupkgs /p:PackageVersion=${{ env.PACKAGE_VERSION }}
          dotnet pack src/Sharphy.Cli/Sharphy.Cli.csproj -c Release -o ./nupkgs /p:PackageVersion=${{ env.PACKAGE_VERSION }}
          Get-ChildItem -Path ./nupkgs -Filter *.nupkg | Select-Object FullName, Length

      - name: Push Packages to GitHub Packages (GitHub NuGet Registry)
        shell: pwsh
        run: |
          $packages = Get-ChildItem -Path ./nupkgs -Filter *.nupkg
          foreach ($pkg in $packages) {
            Write-Output "Pushing $($pkg.FullName) to GitHub Packages..."
            dotnet nuget push $pkg.FullName --source "https://nuget.pkg.github.com/baharmaulidiii/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
          }

      - name: Push Packages to NuGet.org (if secret is configured)
        if: env.NUGET_API_KEY != ''
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: pwsh
        run: |
          $packages = Get-ChildItem -Path ./nupkgs -Filter *.nupkg
          foreach ($pkg in $packages) {
            Write-Output "Pushing $($pkg.FullName) to NuGet.org..."
            dotnet nuget push $pkg.FullName --source "https://api.nuget.org/v3/index.json" --api-key $env:NUGET_API_KEY --skip-duplicate
          }

      - name: Upload nupkg Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./nupkgs/*.nupkg
