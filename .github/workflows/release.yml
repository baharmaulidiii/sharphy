name: Release Orchestrator

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string to release (e.g., 1.0.0 or 1.0.0)'
        required: true
        default: '1.0.0'
      publish_packages:
        description: 'Publish new package (NuGet & GitHub Packages)'
        type: boolean
        required: true
        default: true
      prerelease:
        description: 'Mark as pre-release on GitHub Releases'
        type: boolean
        required: true
        default: false
      deploy_docs:
        description: 'Deploy documentation portal to GitHub Pages'
        type: boolean
        required: true
        default: true

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------
  # Job 1: Build & Multi-Target Test Verification
  # -------------------------------------------------------------
  verify:
    name: Verify Multi-Target Build & Tests
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8 & 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore Sharphy.sln

      - name: Build solution in Release mode
        run: dotnet build Sharphy.sln -c Release --no-restore

      - name: Run test suite (.NET 8)
        run: dotnet run --project tests/Sharphy.Tests/Sharphy.Tests.csproj --framework net8.0 -c Release

      - name: Run test suite (.NET 10)
        run: dotnet run --project tests/Sharphy.Tests/Sharphy.Tests.csproj --framework net10.0 -c Release

  # -------------------------------------------------------------
  # Job 2: Packaging & Publication (Conditional)
  # -------------------------------------------------------------
  publish_packages:
    name: Package & Publish NuGet Artifacts
    needs: verify
    if: github.event.inputs.publish_packages != 'false'
    runs-on: windows-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    outputs:
      package_version: ${{ steps.versioning.outputs.version }}
      tag_name: ${{ steps.versioning.outputs.tag }}

    steps:
      - name: Checkout repository (fetch full history for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK 8 & 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Determine Package Version & Tag
        id: versioning
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.version }}" -ne "") {
            $rawVer = "${{ github.event.inputs.version }}"
          } elseif ("${{ github.ref_name }}" -match '^v?(.*)$') {
            $rawVer = $matches[1]
          } else {
            $rawVer = "1.0.0"
          }
          $ver = $rawVer.TrimStart('v')
          $tag = "v$ver"

          Write-Output "Resolved version: $ver"
          Write-Output "Resolved git tag: $tag"

          "version=$ver" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "PACKAGE_VERSION=$ver" >> $env:GITHUB_ENV
          "TAG_NAME=$tag" >> $env:GITHUB_ENV

      - name: Restore dependencies
        run: dotnet restore Sharphy.sln

      - name: Pack All 3 Packages (Core, Server, Cli)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./nupkgs
          dotnet pack src/Sharphy.Core/Sharphy.Core.csproj -c Release -o ./nupkgs /p:PackageVersion=${{ env.PACKAGE_VERSION }}
          dotnet pack src/Sharphy.Server/Sharphy.Server.csproj -c Release -o ./nupkgs /p:PackageVersion=${{ env.PACKAGE_VERSION }}
          dotnet pack src/Sharphy.Cli/Sharphy.Cli.csproj -c Release -o ./nupkgs /p:PackageVersion=${{ env.PACKAGE_VERSION }}
          Get-ChildItem -Path ./nupkgs -Filter *.nupkg | Select-Object FullName, Length

      - name: Push Packages to GitHub Packages (GitHub NuGet Registry)
        shell: pwsh
        run: |
          $packages = Get-ChildItem -Path ./nupkgs -Filter *.nupkg
          foreach ($pkg in $packages) {
            Write-Output "Pushing $($pkg.FullName) to GitHub Packages..."
            dotnet nuget push $pkg.FullName --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
          }

      - name: NuGet Login via OIDC (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: baharmaulidiii

      - name: Push Packages to NuGet.org (Trusted Publishing / OIDC)
        shell: pwsh
        run: |
          $apiKey = "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          if ([string]::IsNullOrWhiteSpace($apiKey)) {
            $apiKey = "${{ secrets.NUGET_API_KEY }}"
          }

          if ([string]::IsNullOrWhiteSpace($apiKey)) {
            Write-Error "NuGet authentication is unavailable (OIDC token is empty and NUGET_API_KEY secret is not set)."
            exit 1
          }

          $packages = Get-ChildItem -Path ./nupkgs -Filter *.nupkg
          foreach ($pkg in $packages) {
            Write-Output "Pushing $($pkg.FullName) to NuGet.org..."
            dotnet nuget push $pkg.FullName --source "https://api.nuget.org/v3/index.json" --api-key $apiKey --skip-duplicate
          }

      - name: Upload nupkgs for Release Job
        uses: actions/upload-artifact@v4
        with:
          name: release-nuget-packages
          path: ./nupkgs/*.nupkg

  # -------------------------------------------------------------
  # Job 3: Create GitHub Release (If Packages Published or Tagged)
  # -------------------------------------------------------------
  create_release:
    name: Create GitHub Release
    needs: [verify, publish_packages]
    if: always() && needs.verify.result == 'success' && (needs.publish_packages.result == 'success' || github.event.inputs.publish_packages == 'false')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Version & Tag
        id: release_meta
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RAW_VER="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref_name }}" =~ ^v?(.*)$ ]]; then
            RAW_VER="${BASH_REMATCH[1]}"
          else
            RAW_VER="1.0.0"
          fi
          VER="${RAW_VER#v}"
          TAG="v$VER"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Download NuGet artifacts (if published)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: release-nuget-packages
          path: ./release-artifacts

      - name: Extract Release Notes from CHANGELOG.md
        id: changelog_extract
        shell: bash
        run: |
          TAG="${{ steps.release_meta.outputs.tag }}"
          VER="${{ steps.release_meta.outputs.version }}"
          echo "Extracting release notes for version $VER ($TAG)..."
          
          NOTE_FILE="release_notes.md"
          awk "/## \[$VER\]/{flag=1;next}/## \[/{flag=0}flag" CHANGELOG.md > "$NOTE_FILE" || true
          
          if [ ! -s "$NOTE_FILE" ]; then
            echo "Release $TAG of Sharphy: CLR Intelligence & Runtime Forensic Bridge for AI Coding Agents." > "$NOTE_FILE"
          fi
          cat "$NOTE_FILE"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Release ${{ steps.release_meta.outputs.tag }}
          body_path: release_notes.md
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          files: |
            ./release-artifacts/*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------
  # Job 4: Deploy Docs to GitHub Pages (Conditional)
  # -------------------------------------------------------------
  deploy_docs:
    name: Deploy Docs to GitHub Pages
    needs: [verify]
    if: github.event.inputs.deploy_docs != 'false'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: docs
        run: npm ci || npm install

      - name: Build Next.js documentation
        working-directory: docs
        run: npm run build
        env:
          GITHUB_ACTIONS: true
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
