name: 🐛 Bug Report
description: Report technical issues, ClrMD diagnostic failures, or runtime exceptions in Sharphy.
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue!
        *Please check that this issue has not already been reported in the Issues list.*
        *If this involves a critical security vulnerability, please submit via [GitHub Security Advisories](https://github.com/baharmaulidiii/sharphy/security/advisories/new).*
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: A clear and concise description of the bug or unexpected behavior.
      placeholder: E.g., When invoking sharphy_inspect_heap on a 64-bit memory dump, an ObjectDisposedException is thrown...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step reproduction instructions.
      placeholder: |
        1. Run `sharphy mcp start`
        2. Send JSON-RPC `tools/call` for `sharphy_decompile_method`
        3. Provide assembly path '...'
        4. Error occurs...
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: The tool should return decompiled C# source without runtime exceptions.
    validations:
      required: true
  - type: textarea
    id: logs-and-output
    attributes:
      label: Logs / Stderr Output / Stack Trace
      description: Paste error output or stack traces from stderr.
      render: shell
  - type: dropdown
    id: target-framework
    attributes:
      label: .NET Target Framework
      description: .NET runtime version used when the issue occurred.
      options:
        - .NET 8.0 (LTS)
        - .NET 9.0 (STS)
        - .NET 10.0 (Latest)
        - Other / Custom Runtime
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating System
      options:
        - Windows (x64)
        - Linux (x64)
        - macOS (Apple Silicon / x64)
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Verification
      options:
        - label: I have verified this behavior using the latest stable release of Sharphy.
          required: true
