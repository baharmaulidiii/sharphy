name: 🚀 Feature Request
description: Propose new capabilities, additional MCP tools, or architecture improvements for Sharphy.
title: "[FEAT]: "
labels: ["enhancement", "proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing an enhancement to Sharphy!
  - type: textarea
    id: problem-statement
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific limitation or pain point?
      placeholder: E.g., AI agents cannot easily correlate native memory allocations during dump analysis...
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution & MCP Tool Design
      description: Detailed description of the feature, proposed MCP tool schema, or diagnostic engine.
      placeholder: Suggest adding a tool named `sharphy_inspect_native_heap` accepting parameters...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Considered Alternatives
      description: Any alternative implementations or workarounds evaluated.
  - type: checkboxes
    id: contribution
    attributes:
      label: Willingness to Contribute
      options:
        - label: I am interested in implementing this feature and submitting a pull request under DCO 1.1.
