<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Pure Black Background Container with Subtle Border -->
  <rect width="512" height="512" rx="112" fill="#000000" stroke="#333333" stroke-width="4" />

  <!-- Subtle Precision Forensic Grid (Monochrome) -->
  <g stroke="#1a1a1a" stroke-width="2" stroke-linecap="round">
    <line x1="80" y1="170" x2="432" y2="170" stroke-dasharray="6 8" />
    <line x1="80" y1="342" x2="432" y2="342" stroke-dasharray="6 8" />
    <line x1="170" y1="80" x2="170" y2="432" stroke-dasharray="6 8" />
    <line x1="342" y1="80" x2="342" y2="432" stroke-dasharray="6 8" />
  </g>

  <!-- SHARP MONOGRAM (S + # in Pure White) -->
  <g fill="#FFFFFF">
    <!-- Top Horizontal Shard of S -->
    <polygon points="130,120 370,120 370,185 220,185 170,185 130,120" />
    
    <!-- Top-to-Center Diagonal Sharp Bridge -->
    <polygon points="130,120 200,120 382,240 312,240" />

    <!-- Center Horizontal Bar -->
    <polygon points="170,230 342,230 342,282 170,282" />

    <!-- Center-to-Bottom Diagonal Sharp Bridge -->
    <polygon points="312,272 382,272 200,392 130,392" />

    <!-- Bottom Horizontal Shard of S -->
    <polygon points="142,327 292,327 292,392 142,392" />
    <polygon points="142,327 382,327 382,392 200,392" />
  </g>

  <!-- High-Precision C# / CLR Slices (Cutouts in Pure Black) -->
  <g stroke="#000000" stroke-width="12" stroke-linecap="square">
    <!-- Vertical Slices -->
    <line x1="215" y1="90" x2="215" y2="422" />
    <line x1="297" y1="90" x2="297" y2="422" />
    <!-- Diagonal Precision Cross Cut -->
    <line x1="110" y1="380" x2="402" y2="132" stroke-width="6" />
  </g>

  <!-- Sharp Forensic Dot Accents (Pure White) -->
  <circle cx="395" cy="120" r="6" fill="#FFFFFF" />
  <circle cx="117" cy="392" r="6" fill="#FFFFFF" />
  <rect x="248" y="248" width="16" height="16" fill="#000000" stroke="#FFFFFF" stroke-width="3" />
</svg>
