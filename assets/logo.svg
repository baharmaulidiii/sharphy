<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#161f30" />
      <stop offset="100%" stop-color="#0a0d14" />
    </radialGradient>

    <!-- Primary Neon Blue Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <!-- Deep Violet Accent Gradient -->
    <linearGradient id="violetBeam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F00FF" />
      <stop offset="100%" stop-color="#E100FF" />
    </linearGradient>

    <!-- Core Sharp Prism Gradient -->
    <linearGradient id="sharpShard" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#38E1FF" />
      <stop offset="100%" stop-color="#0051FF" />
    </linearGradient>

    <!-- Drop Shadows & Glow -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
    </filter>
  </defs>

  <!-- Base Badge Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" stroke="#30363d" stroke-width="3" />

  <!-- Ambient Backdrop Light -->
  <circle cx="256" cy="256" r="140" fill="#00f2fe" opacity="0.15" filter="url(#softGlow)" />
  <circle cx="340" cy="180" r="100" fill="#e100ff" opacity="0.12" filter="url(#softGlow)" />

  <!-- CLR / C# Grid Circuit Background Lines -->
  <g opacity="0.18" stroke="#4FACFE" stroke-width="2" stroke-linecap="round">
    <line x1="80" y1="170" x2="432" y2="170" stroke-dasharray="8 8" />
    <line x1="80" y1="342" x2="432" y2="342" stroke-dasharray="8 8" />
    <line x1="170" y1="80" x2="170" y2="432" stroke-dasharray="8 8" />
    <line x1="342" y1="80" x2="342" y2="432" stroke-dasharray="8 8" />
  </g>

  <!-- FORENSIC PRISM CORE (SHARP 'S' + '#' GEOMETRY) -->
  <g filter="url(#coreGlow)">
    
    <!-- Left Sharp Crystal Wing (forming top of S and left # pillar) -->
    <path d="M 230 100 
             L 320 100 
             L 280 200 
             L 190 200 
             Z" 
          fill="url(#neonCyan)" />

    <!-- Center Bridge Shard -->
    <path d="M 190 200 
             L 330 200 
             L 290 280 
             L 150 280 
             Z" 
          fill="url(#sharpShard)" />

    <!-- Right Sharp Crystal Wing (forming bottom of S and right # pillar) -->
    <path d="M 220 280 
             L 360 280 
             L 320 380 
             L 180 380 
             Z" 
          fill="url(#neonCyan)" />

    <!-- Cross-Cutting Forensic Laser Beams (The # Slash Accent) -->
    <polygon points="350,110 375,120 250,400 225,390" fill="url(#violetBeam)" opacity="0.85" />
    <polygon points="290,110 315,120 190,400 165,390" fill="url(#neonCyan)" opacity="0.4" />

  </g>

  <!-- Modern Optical Forensic Nodes -->
  <circle cx="362" cy="115" r="7" fill="#E100FF" filter="url(#coreGlow)" />
  <circle cx="238" cy="395" r="7" fill="#00F2FE" filter="url(#coreGlow)" />
  <circle cx="150" cy="280" r="5" fill="#FFFFFF" />
  <circle cx="330" cy="200" r="5" fill="#FFFFFF" />

  <!-- Inner Spark Highlights -->
  <polygon points="275,230 295,240 275,250 255,240" fill="#FFFFFF" opacity="0.9" filter="url(#coreGlow)" />
</svg>
